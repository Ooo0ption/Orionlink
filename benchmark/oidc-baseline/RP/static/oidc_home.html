<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Brokered OIDC RP</title>
    <style>
        :root { --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b;
            --line:#e2e8f0; --brand:#4f46e5; --brand-soft:#eef2ff; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#0b1020; --card:#121a2e; --ink:#e6ebf5; --muted:#93a1b8;
                --line:#24304a; --brand:#8b93ff; --brand-soft:#1a2136; }
        }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); line-height:1.5;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
        .topbar { display:flex; align-items:center; gap:10px; padding:14px 22px;
            border-bottom:1px solid var(--line); background:var(--card); font-weight:800; }
        .dot { width:12px; height:12px; border-radius:50%; background:var(--brand);
            box-shadow:0 0 0 4px var(--brand-soft); }
        .topbar small { color:var(--muted); font-weight:600; }
        .page { max-width:430px; margin:0 auto; padding:46px 20px 60px; }
        .card { padding:30px 28px; text-align:center; background:var(--card);
            border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(2,6,23,.04); }
        .appmark { width:48px; height:48px; margin:0 auto 13px; border-radius:14px;
            display:grid; place-items:center; color:var(--brand); background:var(--brand-soft);
            font-size:20px; font-weight:800; }
        h1 { margin:0 0 5px; font-size:21px; }
        .sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
        .login-btn { width:100%; padding:12px 18px; color:#fff; background:var(--brand);
            border:0; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700; }
        .note { margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line);
            color:var(--muted); font-size:12.5px; }
    </style>
</head>
<body>
    <div class="topbar"><span class="dot"></span>Brokered OIDC <small>· Relying Party</small></div>
    <main class="page">
      <section class="card">
        <div class="appmark">RP</div>
        <h1>Sign in to the demo app</h1>
        <p class="sub">Continue with the brokered OpenID Connect flow.</p>
        <button id="login" class="login-btn">Login with OIDC</button>
        <p class="note">The request is routed through the broker to the identity provider.</p>
      </section>
    </main>
    <script>
        document.getElementById("login").addEventListener("click", function() {
            // Record the time when user clicks login
            const startTime = Date.now();
            window.location.href = "/oauth2/login?startTime=" + encodeURIComponent(startTime.toString());
        });
    </script>
</body>
</html>
