<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting · Brokered OIDC IdP</title>
    <style>
      :root { --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b;
        --line:#e2e8f0; --brand:#10b981; --brand-soft:#ecfdf5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1020; --card:#121a2e; --ink:#e6ebf5; --muted:#93a1b8;
          --line:#24304a; --brand:#34d399; --brand-soft:#10231a; }
      }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
        background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI",Roboto,Arial,sans-serif; }
      .status { width:min(100%,360px); padding:24px; text-align:center; background:var(--card);
        border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(2,6,23,.04); }
      .mark { width:12px; height:12px; margin:0 auto 12px; border-radius:50%;
        background:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
      p { margin:0; color:var(--muted); font-size:14px; }
    </style>
  </head>
  <body>
    <main class="status"><div class="mark"></div><p>Redirecting…</p></main>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        // 取消按钮交互：如果提供 next，则直接跳转到 next
        if (next) {
          window.location.replace(next);
          return;
        }
        // fallback：如果携带 OIDC 参数，则跳转到 /oauth2/login（服务端会自动完成登录并重定向）
        const hasOidcParams =
          params.get("client_id") && params.get("redirect_uri") && params.get("response_type");
        if (hasOidcParams) {
          window.location.replace("/oauth2/login?" + params.toString());
          return;
        }
        // 最后兜底：回到 IdP 的 authorize（如果你只是手动打开了该页面）
        window.location.replace("/oauth2/authorize");
      })();
    </script>
  </body>
</html>
