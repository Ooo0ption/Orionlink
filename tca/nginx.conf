# TCA static-asset host. Runs in a separate container so that the TCA origin
# (default http://localhost:3003) is distinct from the IdP origin — this is the
# isolation property the OrionLink paper relies on (see revision-plan.md §3,
# reviewer A's question on TCA trust).
#
# Important: this server MUST NOT be co-hosted with the IdP, otherwise the
# origin separation collapses.

server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index dvf.html;

    # No caching during dev so SRI hashes track source.
    add_header Cache-Control "no-store" always;

    # Content-Security-Policy, rendered per-deployment by
    # /docker-entrypoint.d/40-orion-config.sh because frame-ancestors has to
    # name the IdP origin, which varies. A glob include is used so that a
    # container started without the entrypoint still boots rather than failing
    # on a missing file; the compose healthcheck asserts the header is present.
    #
    # The policy can be as tight as it is because the TCA makes no outbound
    # requests at all: since the third-party cryptography was vendored into
    # vendor/crypto-deps.js, every script it executes is same-origin and
    # SRI-pinned, and dvf.js talks to the IdP page only through postMessage.
    include /etc/nginx/orion/*.conf;

    # The dependency tooling is mounted along with the assets (the whole tca/
    # directory is one bind mount), but none of it should be reachable over
    # HTTP: node_modules is a large third-party tree, and serving the build
    # scripts only invites confusion about which file the browser loads.
    location ~ ^/(node_modules|package\.json|package-lock\.json|build-vendor\.sh|update-sri\.sh|SRI\.md|docker-entrypoint\.d)(/|$) {
        return 404;
    }

    # vendor/crypto-deps.js is served; its bundle entry point is source, not an
    # asset the browser ever loads.
    location = /vendor/deps.entry.js {
        return 404;
    }

    # Allow the IdP and Broker pages to fetch / embed TCA assets cross-origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Deployment addresses, rendered from orion-config.js.tmpl at container
    # start by /docker-entrypoint.d/40-orion-config.sh. Served from a writable
    # directory because the html root is bind-mounted read-only.
    location = /orion-config.js {
        alias /usr/share/nginx/orion/orion-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The template is an implementation detail of the rendering step; serving it
    # would only invite confusion about which file the browser actually loads.
    location = /orion-config.js.tmpl {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
