<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connecting · OrionLink Broker</title>
    <style>
      :root { --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b;
        --line:#e2e8f0; --brand:#f59e0b; --brand-soft:#fffbeb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1020; --card:#121a2e; --ink:#e6ebf5; --muted:#93a1b8;
          --line:#24304a; --brand:#fbbf24; --brand-soft:#241c07; }
      }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
        background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI",Roboto,Arial,sans-serif; }
      .box { width:min(100%,380px); padding:28px; text-align:center; background:var(--card);
        border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(2,6,23,.04); }
      .logo { width:48px; height:48px; margin:0 auto 12px; border-radius:14px;
        display:grid; place-items:center; background:var(--brand-soft); color:var(--brand);
        font-size:24px; font-weight:800; }
      h1 { margin:0 0 4px; font-size:20px; }
      p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="logo">↗</div>
      <h1>Connecting securely</h1>
      <p>Preparing your identity provider sign-in…</p>
    </main>
    <script>
      window.addEventListener('message', function(event) {
        if (event.origin !== location.origin) return;
        session_id = event.data.session_id;
        window.location = '/ssso/login?session_id=' + encodeURIComponent(session_id);
      }, false);
    </script>
  </body>
</html>
