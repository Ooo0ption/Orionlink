<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broker · Relay</title>
  <!-- Deployment addresses (window.ORION); served by the broker, not compiled in. -->
  <script src="/ssso/pubconfig.js"></script>
    <style>
      :root {
        --bg:#f6f7fb; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
        --brand:#f59e0b; --brand-soft:#fffbeb; --ok:#16a34a; --bad:#dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1020; --card:#121a2e; --text:#e6ebf5; --muted:#93a1b8; --border:#24304a;
          --brand:#fbbf24; --brand-soft:#241c07; --ok:#4ade80; --bad:#f87171; }
      }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); line-height:1.55;
        font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .topbar { display:flex; align-items:center; gap:10px; padding:12px 18px;
        border-bottom:1px solid var(--border); background:var(--card); font-weight:800; }
      .topbar .dot { width:12px; height:12px; border-radius:50%; background:var(--brand);
        box-shadow:0 0 0 4px var(--brand-soft); }
      .topbar small { font-weight:600; color:var(--muted); }
      .wrap { max-width:560px; margin:48px auto; padding:0 18px; }
      .box { background:var(--card); border:1px solid var(--border); border-radius:16px;
        padding:28px 26px; box-shadow:0 8px 30px rgba(15,23,42,.06); }
      .spinner { width:44px; height:44px; margin:0 auto 16px; border-radius:50%;
        border:4px solid var(--border); border-top-color:var(--brand); animation:spin 1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
      h1 { margin:0 0 6px; font-size:20px; text-align:center; }
      .sub { margin:0 0 20px; text-align:center; color:var(--muted); font-size:13.5px; }
      .actions { text-align:center; }
      button { font:inherit; font-weight:700; cursor:pointer; padding:10px 18px; border-radius:10px;
        border:1px solid var(--border); background:var(--brand-soft); color:var(--text); }
      button:hover { border-color:var(--brand); }
      .banner { display:none; margin:0 0 16px; padding:10px 12px; border-radius:10px; font-size:13px;
        border:1px solid var(--border); background:var(--brand-soft); }
      .banner.show { display:block; }
      details { margin-top:18px; }
      summary { cursor:pointer; font-size:12.5px; color:var(--muted); }
      #log { margin:10px 0 0; background:var(--bg); border:1px solid var(--border); border-radius:10px;
        padding:10px; max-height:220px; overflow:auto; font-size:12px; white-space:pre-wrap;
        font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    </style>
  </head>
  <body>
    <div class="topbar"><span class="dot"></span>OrionLink Broker <small>· relay</small></div>
    <div class="wrap">
      <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Relay page</h1>
        <p class="sub">Nothing to do here. The broker is handing you over to the IdP, and you will be
          redirected back to the app. Please keep this page open.</p>

        <div id="banner" class="banner"></div>

        <div class="actions">
          <button id="manual_open" type="button" hidden>Open the login window</button>
        </div>

        <details>
          <summary>Relay log</summary>
          <pre id="log"></pre>
        </details>
      </div>
    </div>

    <form id="token_exchange_form" method="POST" action="/ssso/codetoken">
      <input type="hidden" name="code" value="" />
      <input type="hidden" name="session_id" value="" />
    </form>

    <script>
      const params = new URLSearchParams(window.location.search);
      const startTimeString = params.get('startTime');
      const startTime = startTimeString ? parseInt(startTimeString, 10) : null;
      if (startTime) {
        const endTime = Date.now();
        const duration = endTime - startTime;
        console.log(`Time taken from Broker generating acid to user clicking login: ${duration} ms`);
      }

      // Appends a line to the on-page log.
      function log(msg){const el=document.getElementById('log');el.textContent+="\n"+msg;}
      // Shows a prominent message to the user.
      function banner(msg){
        const el=document.getElementById('banner');
        el.textContent = msg;
        el.classList.add('show');
      }
      // Reads one cookie by name.
      function getCookie(name) {
        const cookies = document.cookie ? document.cookie.split('; ') : [];
        for (let i = 0; i < cookies.length; i++) {
          const parts = cookies[i].split('=');
          const key = parts.shift();
          const val = parts.join('=');
          if (key === name) return decodeURIComponent(val);
        }
        return null;
      }
      // Fetches JSON, aborting once the timeout elapses.
      async function getWithTimeout(url, ms = 5000) {
        const ac = new AbortController();
        const timer = setTimeout(() => ac.abort(), ms);
        try {
            const res = await fetch(url, { signal: ac.signal, credentials: 'include' });
            clearTimeout(timer);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } catch (e) {
            if (e.name === 'AbortError') throw new Error('timeout');
            throw e;
        }
      }

      session_id = getCookie('session_id');
      t = getCookie('t');
      rp_domain = getCookie('rp_domain');

      // Opens the IdP login popup, falling back to a manual button if the browser
      // blocks it.
      function openLoginPopup() {
        const w = 720, h = 640;
        const left = (screen.width - w) / 2;
        const top = (screen.height - h) / 2;
        const popup = window.open('/static/auth_popup.html', 'Login with IdP', `width=${w},height=${h},top=${top},left=${left}`);
        if (popup) {
          document.getElementById('manual_open').hidden = true;
          log('Opened IdP login popup');
          setTimeout(() => {
            if (!popup.closed) {
              popup.postMessage({ session_id: session_id }, location.origin);
            }
          }, 300);
        } else {
          banner('The browser blocked the popup — open the login window with the button below.');
          document.getElementById('manual_open').hidden = false;
          log('Error: popup blocked by the browser');
        }
        return popup;
      }
      document.getElementById('manual_open').addEventListener('click', openLoginPopup);

      if (session_id) {
        openLoginPopup();
      } else {
        banner('Session expired: no session_id. Please start the login again from the app.');
        log('Error: session_id not found in cookie');
      }


      const TCA_ORIGIN = window.ORION.tcaOrigin;
      const TCA_ORIGINS = new Set(window.ORION.allowedOrigins.filter(function (o) {
        return o === TCA_ORIGIN
          || o === TCA_ORIGIN.replace('//localhost', '//127.0.0.1')
          || o === TCA_ORIGIN.replace('//127.0.0.1', '//localhost');
      }));
      // Reports whether a message came from the TCA origin.
      function isTcaOrigin(o) { return TCA_ORIGINS.has(o); }

      // Answers the TCA's start request with this session's parameters, and
      // submits the authorization code it later returns.
      window.addEventListener('message', async (event) => {
        if (event.data && event.data.type === 'start') {
          if (!isTcaOrigin(event.origin)) {
            log('Ignoring start from non-TCA origin: ' + event.origin);
            return;
          }
          log('Received start message from TCA, sending start_resp');
          try {
            event.source.postMessage(
              { type:'start_resp', session_id: session_id, t: t, rp_domain: rp_domain },
              TCA_ORIGIN,
            );
          } catch (e) {
            console.error('Error sending message:', e);
          }
        }

        if (event.data && event.data.type === 'code') {
          if (!isTcaOrigin(event.origin)) {
            log('Ignoring code from non-TCA origin: ' + event.origin);
            return;
          }
          const code = event.data.code;
          log('Received code from popup window: ' + code);
          const form = document.getElementById('token_exchange_form');
          form.code.value = code;
          form.session_id.value = session_id
          form.submit();
        }
      }, false);
    </script>
  </body>
</html>
